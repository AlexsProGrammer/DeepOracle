<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Ocean gradient background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1B3A5C"/>
      <stop offset="100%" style="stop-color:#0A1628"/>
    </radialGradient>

    <!-- Gold gradient for trident -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>

    <!-- Teal accent -->
    <linearGradient id="teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4"/>
      <stop offset="100%" style="stop-color:#1B3A5C"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#4ECDC4" stroke-width="4" opacity="0.8"/>

  <!-- Simple Trident Symbol -->
  <g transform="translate(256, 256)">
    <!-- Handle -->
    <rect x="-14" y="-80" width="28" height="160" rx="4" fill="url(#gold)"/>

    <!-- Crossbar -->
    <rect x="-70" y="-70" width="140" height="20" rx="4" fill="url(#gold)"/>

    <!-- Center prong -->
    <path d="M -14,-70 L -14,-140 L 0,-170 L 14,-140 L 14,-70 Z" fill="url(#gold)"/>

    <!-- Left prong -->
    <path d="M -70,-70 L -70,-120 L -50,-150 L -30,-120 L -30,-70 Z" fill="url(#gold)"/>

    <!-- Right prong -->
    <path d="M 70,-70 L 70,-120 L 50,-150 L 30,-120 L 30,-70 Z" fill="url(#gold)"/>

    <!-- Center gem -->
    <circle cx="0" cy="-100" r="12" fill="url(#teal)"/>
    <circle cx="-3" cy="-103" r="4" fill="white" opacity="0.6"/>

    <!-- Bottom gem -->
    <circle cx="0" cy="60" r="10" fill="url(#teal)"/>
    <circle cx="-2" cy="58" r="3" fill="white" opacity="0.6"/>
  </g>
</svg>